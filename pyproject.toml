[project]
name = "s1bursts"
description = "Sentinel-1 SLC burst download, SAR and InSAR processing, built on CDSE and ESA SNAP GPT."
authors = [
  { name = "Luis Gentner" , email = "luis.gentner@geo.uzh.ch"},
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "sentinel-1",
    "insar",
    "sar",
    "burst",
    "slc",
    "cdse",
    "copernicus",
    "snap",
    "remote-sensing",
    "coherence",
    "interferometry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dynamic = ["version"]
# Lower bounds reflect the oldest release that supports the required Python
# (>=3.12) and works with this code.
dependencies = [
    # freezecore is the only first-party dependency. It is not yet on PyPI; see
    # [tool.uv.sources] for the development source. Add a tested version range
    # (e.g. `freezecore[s3]>=0.1,<0.2`) once freezecore has its first release.
    "freezecore[s3]",
    "geopandas>=1.1",
    "lxml>=5",
    "numpy>=2.0",
    "odc-geo>=0.5.0",
    "pandas>=2.3",
    "pydantic>=2",
    "pydantic-settings>=2.13.1",
    "pyproj>=3.5",
    "rasterio>=1.5.0",
    "requests>=2.28",
    "rich>=13",
    "shapely>=2",
    "universal-pathlib>=0.3",
]

[project.urls]
Homepage = "https://github.com/lqgentner/s1bursts"
Repository = "https://github.com/lqgentner/s1bursts"
Issues = "https://github.com/lqgentner/s1bursts/issues"
Changelog = "https://github.com/lqgentner/s1bursts/blob/main/CHANGELOG.md"

[dependency-groups]
# Dev tools carry lower bounds too, so `uv sync --resolution lowest-direct`
# (used by the lowest-bound CI job) resolves a working toolchain instead of
# dragging e.g. pytest down to an ancient, uninstallable release.
dev = [
    "debugpy>=1.8",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-geopandas>=1.0",
    "types-requests>=2.31",
]

[tool.uv.sources]
# freezecore is consumed from GitHub (private; requires SSH access) during
# development. Once freezecore is published on PyPI, this override should be
# removed so that a clean public checkout resolves the pinned range from PyPI.
freezecore = { git = "ssh://git@github.com/lqgentner/freezecore.git", tag = "v0.1.0"}

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/s1bursts"]

[tool.hatch.build.targets.sdist]
include = [
    "src/s1bursts",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]
exclude = [".gitignore"]

[tool.ruff]
line-length = 99
src = ["src"]

[tool.ruff.lint]
extend-select = [
    "E",    # Pycodestyle errors (style issues)
    "W",    # Pycodestyle warnings (style issues)
    "C90",  # McCabe – complexity metric for functions
    "I",    # isort – import ordering checks
    "N",    # PEP8 Naming – naming conventions
    "D",    # Pydocstyle – docstring formatting
    "UP",   # Pyupgrade – upgrades syntax to newer Python versions
    "YTT",  # Flake8-2020 – checks for Python 2020 best practices
    "ANN",  # Flake8-annotations – enforces type annotation style
    "ASYNC",# Flake8-async – checks async/await usage
    "S",    # Flake8-bandit – security issues
    "BLE",  # Flake8-blind-except – flags bare excepts
    "FBT",  # Flake8-boolean-trap – potential pitfalls with booleans
    "B",    # Flake8-bugbear – common bug patterns
    "A",    # Flake8-builtins – misuse of Python built-in names
    "COM",  # Flake8-commas – trailing/comma issues
    "C4",   # Flake8-comprehensions – best practices in comprehensions
    "DTZ",  # Flake8-datetimez – requires timezone-aware datetime objects
    "T10",  # Flake8-debugger – debugger statements (e.g. pdb)
    "EM",   # Flake8-errmsg – error message style
    "EXE",  # Flake8-executable – executable file checks
    "FA",   # Flake8-future-annotations – future import for annotations
    "ISC",  # Flake8-implicit-str-concat – warns on implicit string concatenation
    "ICN",  # Flake8-import-conventions – enforces conventional import aliases
    "LOG",  # Flake8-logging – proper logging usage
    "G",    # Flake8-logging-format – logging format string issues
    "INP",  # Flake8-no-pep420 – warns against non-PEP420 namespace usage
    "PIE",  # Flake8-pie – Python improvement suggestions
    "PYI",  # Flake8-pyi – checks for type stub (.pyi) consistency
    "PT",   # Flake8-pytest-style – pytest best practices
    "Q",    # Flake8-quotes – enforces quote style consistency
    "RSE",  # Flake8-raise – proper raise statement usage
    "RET",  # Flake8-return – return statement issues
    "SLF",  # Flake8-self – flags instance methods that don't use self
    "SLOT", # Flake8-slots – suggests use of __slots__ where appropriate
    "SIM",  # Flake8-simplify – code simplification hints
    "TID",  # Flake8-tidy-imports – enforces specific import styles
    "TC",   # Flake8-type-checking – proper import of typing in type checks
    "INT",  # Flake8-gettext – checks for proper internationalization usage
    "ARG",  # Flake8-unused-arguments – flags unused function arguments
    "PTH",  # Flake8-use-pathlib – encourages pathlib over os.path
    "TD",   # Flake8-todos – flags TODO comments
    "FIX",  # Flake8-fixme – flags FIXME comments
    "PD",   # Pandas-vet – checks pandas-specific code practices
    "PGH",  # Pygrep-hooks – custom grep hooks for linting
    "PL",   # Pylint – integration with Pylint conventions
    "TRY",  # Tryceratops – try/except usage suggestions
    "FLY",  # Flynt – f-string conversion suggestions
    "NPY",  # NumPy-specific rules – ensures NumPy coding standards
    "PERF", # Perflint – performance-related checks
    "FURB", # Refurb – rules for code refurbishment
    "RUF",  # Ruff-specific rules – additional Ruff checks
]

ignore = [
    "ANN003",   # flake8-annotations - Missing type annotations for **kwargs
    "ANN401",   # Dynamically typed expressions (typing.Any) are disallowed in `value`
    "PLR0913",  # Pylint - Too many arguments
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = false

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "S101",     # Allow asserts in tests
    "S105",     # Allow dummy passwords in tests
    "S106",     # Allow dummy passwords passed as arguments in tests
    "D101",     # Test class names are self-documenting
    "D102",     # Test method names are self-documenting
    "D103",     # Test function names are self-documenting
    "FBT",      # Don't care about booleans as positional arguments in tests
    "PLR2004",  # Allow magic values in tests
    "SLF001",   # Allow accesses on "private" class members.
    "TC003",    # Runtime imports of stdlib types are fine in tests
]

[tool.ruff.lint.isort]
known-first-party = ["s1bursts"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires network access, CDSE credentials, and/or a local SNAP install (deselected by default; run with `pytest -m integration`)",
]
filterwarnings = [
    # Raised inside rasterio's compiled _io.pyx read() path under NumPy 2.5 when
    # reading DIMAP/GeoTIFF products; only a future rasterio release (>1.5.0) can
    # fix it at the source.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]

[tool.mypy]
ignore_missing_imports = true
files = ["src/s1bursts"]

[tool.coverage.run]
branch = true
source = ["s1bursts"]

[tool.coverage.report]
# Regression guard, not a target. Raise this as the operationally important
# paths (burst_extractor, burstmap, snap_client) gain behaviour-driven tests.
fail_under = 85
show_missing = true
