name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Lets publish.yml run this exact gate before uploading anything, so a release
  # can never ship a commit that has not passed these checks.
  workflow_call:
    inputs:
      build_version:
        description: Optional PEP 440 version override used for TestPyPI builds.
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # One cache entry per environment: jobs sharing an entry only restore it, so
          # packages built from source for another Python would rebuild every run.
          cache-suffix: py3.15
      - run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  prose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VALE_VERSION: 3.19.0
      VALE_SHA256: c8f9d6c8055442bc7e9c121b2498e6f0e3fb670f4665e6ee577f1897f7665cf6
    steps:
      - uses: actions/checkout@v7
      - name: Install Vale
        working-directory: ${{ runner.temp }}
        run: |
          archive="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -fsSLO --retry 3 "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/${archive}"
          echo "${VALE_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" vale
          echo "$PWD" >> "$GITHUB_PATH"
      # A download from GitHub releases fails with a 504 often enough to fail a
      # correct pull request, so the sync is retried.
      - name: Download the rule packages
        run: |
          for delay in 0 10 30; do
            sleep "$delay"
            vale sync && exit 0
          done
          exit 1
      # Vale exits with an error only for error-level alerts, so the step fails
      # on any output instead, which keeps the docs free of warnings as well.
      - name: Vale
        shell: bash
        run: |
          vale --output=line $(git ls-files '*.md' '*.qmd') | tee "$RUNNER_TEMP/vale.txt"
          test ! -s "$RUNNER_TEMP/vale.txt"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: py3.15
      - run: uv sync
      - name: pyrefly
        run: uv run pyrefly check

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}
      - name: Run offline unit tests with coverage
        run: >
          uv run --python ${{ matrix.python-version }}
          pytest -q --cov=s1bursts --cov-branch
          --cov-report=term-missing --cov-report=xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.15'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          use_oidc: true

  test-lowest:
    # Verifies the declared dependency lower bounds actually install and pass on
    # the minimum supported Python (3.12). `--resolution lowest-direct` pins
    # every direct dependency (runtime and dev tools) to its floor, so
    # the dev group carries lower bounds too (see [dependency-groups] in
    # pyproject.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: lowest
      - name: Sync dependencies at their lower bounds
        run: uv sync --resolution lowest-direct --python 3.12
      - name: Run tests
        # --no-sync keeps `uv run` from re-resolving the environment back to the
        # latest versions before running.
        run: uv run --no-sync pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from git tags/history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: build
      - name: Build sdist and wheel
        env:
          BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          if [ -n "$BUILD_VERSION" ]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="$BUILD_VERSION"
          fi
          uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Assert the distributions carry what they claim
        # Guards the packaging config: the wheel must ship the runtime package
        # with its data files and typing marker, and the sdist must carry the
        # sources and tests needed to rebuild and verify from it.
        run: |
          python - <<'EOF'
          import glob, sys, tarfile, zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "s1bursts/__init__.py",
              "s1bursts/py.typed",
              "s1bursts/burstinfo.css",
          ]
          missing = [name for name in required if name not in names]
          modules = [n for n in names if n.startswith("s1bursts/") and n.endswith(".py")]

          sdist = glob.glob("dist/*.tar.gz")[0]
          members = ["/".join(n.split("/")[1:]) for n in tarfile.open(sdist).getnames()]
          for name in ("pyproject.toml", "README.md", "LICENSE", "CHANGELOG.md"):
              if name not in members:
                  missing.append(f"sdist:{name}")
          if not any(m.startswith("tests/") for m in members):
              missing.append("sdist:tests/")
          if not any(m.startswith("src/s1bursts/") for m in members):
              missing.append("sdist:src/s1bursts/")

          print(f"wheel modules: {len(modules)}")
          if missing:
              sys.exit(f"Distributions are missing: {missing}")
          print("packaging OK")
          EOF
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke "$(ls dist/*.whl)"
          uv run --python /tmp/smoke --no-project python -c "import s1bursts; from s1bursts import BurstCatalog, BurstProcessor, FileManager, SearchQuery; print('import OK')"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14
