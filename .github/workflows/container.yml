name: Build and push SNAP container

# The SNAP image (containers/Dockerfile.snap) changes only when the SNAP version
# is bumped, so it is built on demand rather than on a schedule. The integration
# workflow pins a tag of it; bump that pin after publishing here.

on:
  workflow_dispatch:
    inputs:
      snap_version:
        description: "ESA SNAP version to bake into the image (blank: the Dockerfile's default)"
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - containers/Dockerfile.snap
      - .github/workflows/container.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-snap

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # The build holds the SNAP installer and the unpacked install at once. The
      # runner image ships toolchains this build never uses; reclaiming them
      # keeps it clear of the disk limit.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Resolve the SNAP version to build
        id: version
        # On a dispatch the version comes from the input; on a push it comes
        # from the Dockerfile's own default, so the image and the file that
        # describes it can never disagree.
        run: |
          set -euo pipefail
          default="$(grep -oP 'ARG SNAP_VERSION=\K[0-9.]+' containers/Dockerfile.snap)"
          version="${{ inputs.snap_version }}"
          if [ -z "${version}" ]; then
            version="${default}"
          fi
          echo "snap=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=snap${version}" >> "$GITHUB_OUTPUT"
          # `latest` follows the Dockerfile default, so building any other
          # version publishes its own tag only.
          if [ "${version}" = "${default}" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Dockerfile.snap
          platforms: linux/amd64
          push: true
          build-args: |
            SNAP_VERSION=${{ steps.version.outputs.snap }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.latest == 'true' && format('{0}/{1}:latest', env.REGISTRY, env.IMAGE_NAME) || '' }}

      - name: Verify gpt runs in the published image
        # A SNAP install that cannot start is the one failure this workflow must
        # never publish silently, so the pushed image is exercised before the
        # summary claims success.
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:${{ steps.version.outputs.tag }}"
          # Captured before trimming: piping straight into `head` closes the pipe
          # after five lines, and under `pipefail` that broken pipe fails the
          # step even though gpt ran perfectly well.
          usage="$(docker run --rm "$image" gpt -h)"
          printf '%s\n' "$usage" | head -5
          docker run --rm "$image" sh -c 'test -x "$SNAP_BIN/gpt"'
          docker run --rm "$image" uv --version
          docker run --rm "$image" gdal_translate --version

      - name: Summary
        run: |
          {
            echo "Pushed \`${REGISTRY}/${IMAGE_NAME}:${{ steps.version.outputs.tag }}\`"
            echo ""
            echo "Pin this tag in \`.github/workflows/integration.yml\` (the \`legs\` job's matrix)."
          } >> "$GITHUB_STEP_SUMMARY"
